  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230b0f14'/><text x='32' y='42' text-anchor='middle' font-size='28' fill='%23e8f36a' font-family='sans-serif'>20</text></svg>" />
  <style>
    :root {
      --bg: #07090c;
      --text: #f4f6f5;
      --muted: rgba(244, 246, 245, 0.72);
      --line: rgba(255, 255, 255, 0.14);
      --accent: #e8f36a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }

    .stage {
      position: relative;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom));
      overflow: hidden;
    }

    .bg video,
    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .bg video { z-index: 0; }

    .shade {
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(180deg, rgba(7, 9, 12, 0.35) 0%, rgba(7, 9, 12, 0.55) 45%, rgba(7, 9, 12, 0.82) 100%),
        radial-gradient(120% 80% at 50% 20%, transparent 0%, rgba(7, 9, 12, 0.45) 70%);
    }

    .content {
      position: relative;
      z-index: 2;
      width: min(640px, 100%);
      text-align: center;
    }

    .mark {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 28px;
      letter-spacing: 0.22em;
      font-size: 11px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .mark span {
      color: var(--accent);
      letter-spacing: 0.08em;
      font-weight: 700;
    }

    h1 {
      font-size: clamp(40px, 12vw, 84px);
      line-height: 0.9;
      font-weight: 650;
      letter-spacing: -0.05em;
    }

    h1 em {
      font-style: normal;
      color: var(--accent);
    }

    .soon {
      margin-top: 18px;
      font-size: clamp(13px, 3.4vw, 15px);
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: var(--muted);
    }

    p.lead {
      margin: 22px auto 0;
      max-width: 26rem;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
    }

    .row {
      margin-top: 32px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    a.btn {
      min-height: 44px;
      padding: 0 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--text);
      text-decoration: none;
      font-size: 13px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(10px);
    }

    a.btn:hover { border-color: var(--accent); color: var(--accent); }

    footer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: max(16px, env(safe-area-inset-bottom));
      z-index: 2;
      text-align: center;
      font-size: 11px;
      letter-spacing: 0.08em;
      color: rgba(244, 246, 245, 0.45);
    }

    @media (prefers-reduced-motion: reduce) {
      .bg video { display: none; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="bg" aria-hidden="true">
      <video autoplay muted loop playsinline>
        <source src="assets/bg.mp4" type="video/mp4" />
      </video>
    </div>
    <div class="shade"></div>

    <div class="content">
      <div class="mark">Base · B20</div>
      <h1>Twenty<br /><em>Launchpad</em></h1>
      <div class="soon">Coming soon</div>
      <p class="lead">Instant B20 token launches on Base, with Uniswap v4 liquidity in one transaction.</p>
      <div class="row">
        <a class="btn" href="https://x.com/twentypad" target="_blank" rel="noopener">X @twentypad</a>
        <a class="btn" href="https://t.me/twentypad" target="_blank" rel="noopener">Telegram</a>
        <a class="btn" href="https://github.com/twentypad" target="_blank" rel="noopener">Github</a>
      </div>
    </div>

    <footer>twentypad.com</footer>
  </main>
</body>
</html>
